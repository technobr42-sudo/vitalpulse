<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VitalPulse - Energy & Macro Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans">
    <div class="max-w-6xl mx-auto px-4 py-8">
        <header class="border-b border-gray-800 pb-6 mb-8 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold text-emerald-400">VitalPulse AI</h1>
                <p class="text-gray-400 text-sm">Real-Time Energy Calculation Engine</p>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700">
                <h2 class="text-xl font-semibold mb-4 text-emerald-300">Body Metrics</h2>
                <form id="profileForm" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-gray-400">Age</label>
                        <input type="number" id="age" value="17" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm text-white" required>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-400">Sex</label>
                        <select id="sex" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm text-white">
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-medium text-gray-400">Weight (kg)</label>
                            <input type="number" id="weight" value="65" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm text-white" required>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-400">Height (cm)</label>
                            <input type="number" id="height" value="175" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm text-white" required>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-400">Activity Level</label>
                        <select id="activity" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm text-white">
                            <option value="sedentary">Sedentary (School / Desk)</option>
                            <option value="moderate">Moderate (1h Dance / Sports)</option>
                            <option value="active">Active (Heavy Athletics)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-400">Goal</label>
                        <select id="goal" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm text-white">
                            <option value="gain">Gain Muscle / Mass</option>
                            <option value="maintain">Maintain Energy</option>
                            <option value="lose">Fat Loss</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-400">Notes</label>
                        <input type="text" id="notes" placeholder="e.g. Vegetarian" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm text-white">
                    </div>
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-2 rounded font-medium text-sm transition">Calculate Targets</button>
                </form>
            </div>

            <div class="lg:col-span-2 space-y-6">
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                    <div class="bg-gray-800 p-4 rounded-xl border border-gray-700">
                        <span class="text-xs text-gray-400">Target Calories</span>
                        <p id="targetCal" class="text-2xl font-bold text-emerald-400">--</p>
                    </div>
                    <div class="bg-gray-800 p-4 rounded-xl border border-gray-700">
                        <span class="text-xs text-gray-400">Protein Target</span>
                        <p id="targetProt" class="text-2xl font-bold text-blue-400">--</p>
                    </div>
                    <div class="bg-gray-800 p-4 rounded-xl border border-gray-700">
                        <span class="text-xs text-gray-400">Carbohydrates</span>
                        <p id="targetCarb" class="text-2xl font-bold text-amber-400">--</p>
                    </div>
                    <div class="bg-gray-800 p-4 rounded-xl border border-gray-700">
                        <span class="text-xs text-gray-400">Basal Rate (BMR)</span>
                        <p id="targetBmr" class="text-2xl font-bold text-purple-400">--</p>
                    </div>
                </div>

                <div class="bg-gray-800 rounded-xl border border-gray-700 flex flex-col h-[400px]">
                    <div class="p-4 border-b border-gray-700 font-semibold text-sm text-gray-300">Real-Time Assistant</div>
                    <div id="chatWindow" class="flex-1 p-4 overflow-y-auto space-y-3 text-sm">
                        <div class="bg-gray-900 p-3 rounded-lg max-w-[80%] border border-gray-700">Update your metrics to begin.</div>
                    </div>
                    <form id="chatForm" class="p-3 border-t border-gray-700 flex gap-2">
                        <input type="text" id="chatInput" placeholder="Ask a question..." class="flex-1 bg-gray-900 border border-gray-700 rounded px-3 py-2 text-sm text-white focus:outline-none">
                        <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded text-sm">Send</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                user_id: "default_user",
                age: parseInt(document.getElementById('age').value),
                sex: document.getElementById('sex').value,
                weight_kg: parseFloat(document.getElementById('weight').value),
                height_cm: parseFloat(document.getElementById('height').value),
                activity_level: document.getElementById('activity').value,
                goal: document.getElementById('goal').value,
                notes: document.getElementById('notes').value
            };

            const res = await fetch('/api/profile', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await res.json();
            
            document.getElementById('targetCal').innerText = result.metrics.target_calories + ' kcal';
            document.getElementById('targetProt').innerText = result.metrics.protein_g + ' g';
            document.getElementById('targetCarb').innerText = result.metrics.carbs_g + ' g';
            document.getElementById('targetBmr').innerText = result.metrics.bmr + ' kcal';
        });

        document.getElementById('chatForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (!msg) return;

            const chatWindow = document.getElementById('chatWindow');
            chatWindow.innerHTML += `<div class="bg-emerald-900/40 border border-emerald-700 text-emerald-100 p-3 rounded-lg max-w-[80%] ml-auto">${msg}</div>`;
            input.value = '';

            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: "default_user", message: msg })
            });
            const result = await res.json();

            chatWindow.innerHTML += `<div class="bg-gray-900 p-3 rounded-lg max-w-[80%] border border-gray-700">${result.response}</div>`;
            chatWindow.scrollTop = chatWindow.scrollHeight;
        });
    </script>
</body>
</html>
